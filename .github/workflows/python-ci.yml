name: Python Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install Django and DRF dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      # Run Django migrations and tests
      # This block sets up a dummy Secret Key for testing purposes so your build doesn't crash
      - name: Run Django Tests
        env:
          SECRET_KEY: 'ci-testing-secret-key-safe-to-expose'
          DEBUG: 'False'
        run: |
          cd backend
          python manage.py migrate
          python manage.py test
