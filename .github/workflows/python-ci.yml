name: Python Backend CI Pipeline
run-name: Backend Build/Release - ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - 'frontend/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'

# CRITICAL: Added permissions for secure identity verification
permissions:
  contents: read
  id-token: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quest4rides
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Run Django Tests
        env:
          DEBUG: 'True'
          MANAGEMENT_SECRET_CODE: 'ci-mock-management-code-123'
          DB_NAME: quest4rides
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          EMAIL_HOST_USER: 'test@example.com'
          EMAIL_HOST_PASSWORD: 'testpassword'
        run: |
          cd backend
          python manage.py migrate
          python manage.py test

  build-backend-docker:
    needs: test-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Keyless Authentication with Google Cloud
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/361383206203/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@project-95eb9e37-8269-4627-bb0.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quest-for-rides-backend
            africa-south1-docker.pkg.dev/project-95eb9e37-8269-4627-bb0/quest4rides-repo/backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and Push Django Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy quest-for-rides-backend \
            --image africa-south1-docker.pkg.dev/project-95eb9e37-8269-4627-bb0/quest4rides-repo/backend:latest \
            --region africa-south1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet