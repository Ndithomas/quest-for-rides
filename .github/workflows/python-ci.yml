name: Python Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install Django and DRF dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      # Run Django migrations and tests
      # We pass required env variables so load_dotenv defaults don't break the initialization
      - name: Run Django Tests
        env:
          DEBUG: 'True'
          MANAGEMENT_SECRET_CODE: 'ci-mock-management-code-123'
          EMAIL_HOST_USER: 'test@example.com'
          EMAIL_HOST_PASSWORD: 'testpassword'
        run: |
          cd backend
          python manage.py migrate
          python manage.py test
