<!-- src/app/reset-password/reset-password.component.html -->
<app-navbar></app-navbar>

<!-- Hero Background -->
<div class="hero-bg">
    <div class="overlay"></div>
</div>

<div class="auth-container">
    <div class="auth-card">
        <div class="card-body p-5">

            <!-- Logo & Title -->
            <div class="text-center mb-5">
                <div class="logo-wrapper mb-4">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="2.5">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                        <path d="M21 16v-2a4 4 0 0 0-4-4 4 4 0 0 0-4 4"></path>
                        <path d="M4 12h16"></path>
                        <circle cx="7" cy="17" r="3"></circle>
                        <circle cx="17" cy="17" r="3"></circle>
                    </svg>
                </div>
                <h2 class="h3 fw-bold text-dark mb-2">Create New Password</h2>
                <p class="text-muted">Enter your reset code and new password</p>
            </div>

            <!-- Reset Password Form -->
            <form #resetForm="ngForm" (ngSubmit)="onSubmit(resetForm)" novalidate>

                <!-- Email -->
                <div class="mb-4">
                    <label class="form-label fw-medium">Email Address</label>
                    <input type="email" class="form-control form-control-lg clean-input" placeholder="Enter your email"
                        [(ngModel)]="resetData.email" name="email" #emailInput="ngModel" required email
                        (input)="onInputChange()" />
                    <div *ngIf="emailInput.invalid && emailInput.touched" class="text-danger small mt-1">
                        <div *ngIf="emailInput.errors?.['required']">Email is required</div>
                        <div *ngIf="emailInput.errors?.['email']">Please enter a valid email address</div>
                    </div>
                </div>

                <!-- Reset Code -->
                <div class="mb-4">
                    <label class="form-label fw-medium">Reset Code</label>
                    <input type="text" class="form-control form-control-lg clean-input"
                        placeholder="Enter 6-digit reset code" [(ngModel)]="resetData.reset_code" name="reset_code"
                        #resetCodeInput="ngModel" required (input)="onInputChange()" />
                    <div *ngIf="resetCodeInput.invalid && resetCodeInput.touched" class="text-danger small mt-1">
                        Reset code is required
                    </div>
                </div>

                <!-- New Password -->
                <div class="mb-4">
                    <label class="form-label fw-medium">New Password</label>
                    <input type="password" class="form-control form-control-lg clean-input"
                        placeholder="Enter new password" [(ngModel)]="resetData.new_password" name="new_password"
                        #newPasswordInput="ngModel" required minlength="6" (input)="onInputChange()" />
                    <div *ngIf="newPasswordInput.invalid && newPasswordInput.touched" class="text-danger small mt-1">
                        <div *ngIf="newPasswordInput.errors?.['required']">Password is required</div>
                        <div *ngIf="newPasswordInput.errors?.['minlength']">Password must be at least 6 characters</div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label fw-medium">Confirm Password</label>
                    <input type="password" class="form-control form-control-lg clean-input"
                        placeholder="Confirm new password" [(ngModel)]="resetData.confirm_password"
                        name="confirm_password" #confirmPasswordInput="ngModel" required (input)="onInputChange()" />
                    <div *ngIf="confirmPasswordInput.invalid && confirmPasswordInput.touched"
                        class="text-danger small mt-1">
                        Please confirm your password
                    </div>
                    <div *ngIf="!passwordsMatch() && resetData.confirm_password" class="text-danger small mt-1">
                        Passwords do not match
                    </div>
                </div>

                <!-- Only ONE clean error message from backend / TS -->
                <div class="alert alert-danger rounded-3 py-3 text-center" *ngIf="error" role="alert">
                    <strong>{{ error }}</strong>
                </div>

                <!-- Success Message -->
                <div class="alert alert-success rounded-3 py-3 text-center" *ngIf="successMessage" role="alert">
                    <strong>{{ successMessage }}</strong>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold rounded-3 mt-2"
                    [disabled]="loading">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    {{ loading ? 'Resetting...' : 'Reset Password' }}
                </button>

                <!-- Back to login link -->
                <p class="text-center mt-4 text-muted small">
                    <a routerLink="/login" class="fw-bold text-primary text-decoration-none">← Back to Login</a>
                </p>
            </form>
        </div>
    </div>
    <div class="bottom-fade"></div>
</div>

<app-footer></app-footer>
