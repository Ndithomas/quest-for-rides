<app-navbar></app-navbar>

<div class="edit-car-container">
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold text-dark mb-3">Edit Car</h1>
      <p class="lead text-muted">Update your vehicle details and photos</p>
    </div>

    <div class="form-card">
      <form (ngSubmit)="submit()">

        <div class="input-grid">
          <input [ngModel]="title()" (ngModelChange)="title.set($event)" name="title" placeholder="Listing Title"
            class="form-input" required />

          <input [ngModel]="make()" (ngModelChange)="make.set($event)" name="make" placeholder="Make (e.g. BMW)"
            class="form-input" required />

          <input [ngModel]="model()" (ngModelChange)="model.set($event)" name="model" placeholder="Model"
            class="form-input" required />

          <input [ngModel]="year()" (ngModelChange)="year.set($event)" name="year" type="number" [max]="maxYear"
            placeholder="Year" class="form-input" required />

          <input [ngModel]="dailyRate()" (ngModelChange)="dailyRate.set($event)" name="dailyRate" type="number"
            min="100" step="50" placeholder="Daily Rate (R)" class="form-input" required />

          <input [ngModel]="licensePlate()" (ngModelChange)="licensePlate.set($event)" name="licensePlate"
            placeholder="License Plate" class="form-input" required />

          <input [ngModel]="locationName()" (ngModelChange)="locationName.set($event)" name="locationName"
            placeholder="Pickup Location (City)" class="form-input" required />

          <select [ngModel]="status()" (ngModelChange)="status.set($event)" name="status" class="form-input">
            <option value="active">Available</option>
            <option value="booked">Booked</option>
            <option value="maintenance">In Maintenance</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <!-- Description & Features -->
        <div class="row g-4 mt-4">
          <div class="col-lg-6">
            <textarea [ngModel]="description()" (ngModelChange)="description.set($event)" name="description"
              placeholder="Description (optional)" class="form-textarea" rows="5"></textarea>
          </div>
          <div class="col-lg-6">
            <textarea [ngModel]="features()" (ngModelChange)="features.set($event)" name="features"
              placeholder="Features (one per line)" class="form-textarea" rows="5"></textarea>
          </div>
        </div>

        <!-- Photos Section -->
        <div class="photo-section mt-5">
          <h5 class="fw-bold mb-3">
            Car Photos <span class="text-muted small">(Max 6 • First = Primary)</span>
          </h5>

          <div class="photo-grid">
            <!-- Existing Photos -->
            <div *ngFor="let photo of existingPhotos(); let i = index" class="photo-item">
              <img [src]="photo.image" class="photo-preview" />
              <button type="button" class="remove-photo" (click)="removeExistingPhoto(photo.id)">×</button>
              <div class="primary-badge" [class.active]="photo.is_primary" (click)="setPrimaryPhoto(photo.id)">
                {{ photo.is_primary ? 'Primary' : 'Set Primary' }}
              </div>
            </div>

            <!-- New Photos -->
            <div *ngFor="let file of selectedFiles; let i = index" class="photo-item new">
              <img [src]="getPreviewUrl(file)" class="photo-preview" />
              <button type="button" class="remove-photo" (click)="removeNewPhoto(i)">×</button>
              <div class="primary-badge" *ngIf="i === 0 && existingPhotos().length === 0">
                Primary
              </div>
            </div>

            <!-- Upload Slot -->
            <label class="upload-slot" *ngIf="existingPhotos().length + selectedFiles.length < 6">
              <input type="file" (change)="onFileSelected($event)" multiple accept="image/*" hidden />
              <div class="upload-inner">
                <i class="bi bi-plus-circle-fill"></i>
                <span>Add Photos<br>
                  <small>{{ 6 - (existingPhotos().length + selectedFiles.length) }} left</small>
                </span>
              </div>
            </label>
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="submit" class="btn btn-success btn-lg rounded-pill px-5" [disabled]="loading()">
            <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
            {{ loading() ? 'Saving...' : 'Save Changes' }}
          </button>

          <button type="button" class="btn btn-outline-secondary btn-lg rounded-pill px-5"
            (click)="router.navigate(['/owner/cars'])">
            Cancel
          </button>
        </div>

        <!-- Messages -->
        <div *ngIf="successMessage()" class="alert alert-success mt-4">
          {{ successMessage() }}
        </div>
        <div *ngIf="errorMessage()" class="alert alert-danger mt-4">
          {{ errorMessage() }}
        </div>
      </form>
    </div>
  </div>
</div>

<app-footer></app-footer>
