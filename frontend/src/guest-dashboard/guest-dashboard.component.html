<app-navbar></app-navbar>

<div class="guest-dashboard">

  <div class="hero">
    <div class="container py-5">
      <div class="row align-items-center">
        <div class="col-lg-8">
          <h1 class="display-5 fw-bold mb-3">
            Welcome <span class="text-warning">{{ username() }}</span>
          </h1>
          <p class="lead">Your next adventure starts here</p>

        </div>
      </div>
    </div>
  </div>

  <div class="container py-5">

    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="stat-card pending">
          <div class="icon"><i class="bi bi-clock"></i></div>
          <div>
            <h3>{{ pendingCount() }}</h3>
            <p>Awaiting Confirmation</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card payment">
          <div class="icon"><i class="bi bi-credit-card"></i></div>
          <div>
            <h3>{{ paymentRequiredCount() }}</h3>
            <p>Payment Required</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card upcoming">
          <div class="icon"><i class="bi bi-car-front"></i></div>
          <div>
            <h3>{{ upcomingCount() }}</h3>
            <p>Upcoming Trips</p>
          </div>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold text-dark mb-1">Browse Available Cars</h2>
          <p class="text-muted">Find your perfect ride</p>
        </div>
       
      </div>
      <app-listings></app-listings>
    </div>

    <div class="mt-5">
      <h3 class="fw-bold mb-4">Quick Actions</h3>
      <div class="row g-3">
        <div class="col-6 col-md-3">
          <a routerLink="/profile" class="action-card">
            <i class="bi bi-person-circle"></i>
            <span>Profile</span>
          </a>
        </div>
        <div class="col-6 col-md-3">
          <a routerLink="/bookings" class="action-card">
            <i class="bi bi-calendar-check me-2"></i>
            <span>My Bookings</span>
          </a>
        </div>
        <div class="col-6 col-md-3">
          <a [routerLink]="['/guest-payment-history']" class="action-card">
            <i class="bi bi-receipt"></i> Payment History
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
