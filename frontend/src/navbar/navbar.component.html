<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">

    <div class="nav-brand" (click)="goHome()">
      <svg width="34" height="34" viewBox="0 0 24 24" stroke="#27ae60" fill="none" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M21 16v-2a4 4 0 0 0-4-4 4 4 0 0 0-4 4"></path>
        <path d="M4 12h16"></path>
        <circle cx="7" cy="17" r="3"></circle>
        <circle cx="17" cy="17" r="3"></circle>
      </svg>
      <span>Quest4Rides</span>
    </div>

    <button class="user-btn"
            (click)="toggleSidebar()"
            [class.active]="isSidebarOpen()"
            [attr.aria-expanded]="isSidebarOpen()">
      @if (isLoggedIn()) {
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" 
                fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="7" r="4" fill="none" 
                  stroke="currentColor" stroke-width="2"/>
        </svg>
      } @else {
        <svg width="28" height="24" viewBox="0 0 34 26">
          <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="3"/>
          <circle cx="26" cy="7.5" r="4.8" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M18 16c0-4 16-4 16-8" fill="none" stroke="currentColor" stroke-width="2.8"/>
        </svg>
      }
    </button>
  </div>

  <div class="dropdown-menu" [class.show]="isSidebarOpen()">
    <div class="dropdown-header">
      <h3>{{ username() }}</h3>
      <p>{{ isLoggedIn() ? 'Your rides are waiting' : 'Welcome to Quest4Rides' }}</p>
    </div>

    @if (isLoggedIn()) {
      <div class="dropdown-items">
        <a routerLink="/profile" (click)="closeSidebar()" class="dropdown-item">My Profile</a>
        <a [routerLink]="getBookingsRoute()" 
           (click)="closeSidebar()" class="dropdown-item">
          {{ getBookingsLabel() }}
        </a>
        <a routerLink="/settings" (click)="closeSidebar()" class="dropdown-item">Settings</a>
        <div class="dropdown-divider"></div>
        <a (click)="logout()" class="dropdown-item logout">Logout</a>
      </div>
    } @else {
      <div class="dropdown-items">
        <a routerLink="/login" (click)="closeSidebar()" class="btn btn-outline">Login</a>
        <a routerLink="/register" (click)="closeSidebar()" class="btn btn-primary">Sign Up</a>
      </div>
    }

    <div class="dropdown-footer">
      <a routerLink="/contact" (click)="closeSidebar()">Contact</a>
      <a routerLink="/how-it-works" (click)="closeSidebar()">How It Works</a>
    </div>
  </div>

</nav>

<div class="dropdown-overlay" 
     [class.show]="isSidebarOpen()" 
     (click)="closeSidebar()"></div>

<div class="nav-spacer"></div>
