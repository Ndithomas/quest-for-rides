<!-- src/app/forgot-password/forgot-password.component.html -->
<app-navbar></app-navbar>

<!-- Hero Background -->
<div class="hero-bg">
    <div class="overlay"></div>
</div>

<div class="auth-container">
    <div class="auth-card">
        <div class="card-body p-5">

            <!-- Logo & Title -->
            <div class="text-center mb-5">
                <div class="logo-wrapper mb-4">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="2.5">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                        <path d="M21 16v-2a4 4 0 0 0-4-4 4 4 0 0 0-4 4"></path>
                        <path d="M4 12h16"></path>
                        <circle cx="7" cy="17" r="3"></circle>
                        <circle cx="17" cy="17" r="3"></circle>
                    </svg>
                </div>
                <h2 class="h3 fw-bold text-dark mb-2">Reset Your Password</h2>
                <p class="text-muted">Enter your email to receive a reset code</p>
            </div>

            <!-- Forgot Password Form -->
            <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" novalidate>

                <!-- Email -->
                <div class="mb-4">
                    <label class="form-label fw-medium">Email Address</label>
                    <input type="email" class="form-control form-control-lg clean-input"
                        placeholder="Enter your registered email" [(ngModel)]="email" name="email" #emailInput="ngModel"
                        required email (input)="onInputChange()" />
                    <div *ngIf="emailInput.invalid && emailInput.touched" class="text-danger small mt-1">
                        <div *ngIf="emailInput.errors?.['required']">Email is required</div>
                        <div *ngIf="emailInput.errors?.['email']">Please enter a valid email address</div>
                    </div>
                </div>

                <!-- Only ONE clean error message from backend / TS -->
                <div class="alert alert-danger rounded-3 py-3 text-center" *ngIf="error" role="alert">
                    <strong>{{ error }}</strong>
                </div>

                <!-- Success Message -->
                <div class="alert alert-success rounded-3 py-3 text-center" *ngIf="successMessage" role="alert">
                    <strong>{{ successMessage }}</strong>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold rounded-3 mt-2"
                    [disabled]="loading">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    {{ loading ? 'Sending Code...' : 'Send Reset Code' }}
                </button>

                <!-- Back to login link -->
                <p class="text-center mt-4 text-muted small">
                    Remember your password?
                    <a routerLink="/login" class="fw-bold text-primary text-decoration-none">Back to Login</a>
                </p>
            </form>
        </div>
    </div>
    <div class="bottom-fade"></div>
</div>

<app-footer></app-footer>
